# glmps.nfunc.xyz — reference copy of the vhost.
#
# The server's own setup script writes this file (one step per nfunc
# subdomain: webroot, certificate, vhost), so this copy is here to show what
# the site needs, not to be installed by hand. The part that matters is the
# SPA fallback: without it /r/<naddr>, /stats and /current return 404.

server {
    listen 80;
    listen [::]:80;
    server_name glmps.nfunc.xyz;
    return 301 https://glmps.nfunc.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glmps.nfunc.xyz;
    ssl_certificate     /etc/letsencrypt/live/glmps.nfunc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glmps.nfunc.xyz/privkey.pem;

    root /var/www/glmps.nfunc.xyz;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite's hashed assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else falls back to index.html, which the browser re-checks
    # every time so a deploy is seen at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
